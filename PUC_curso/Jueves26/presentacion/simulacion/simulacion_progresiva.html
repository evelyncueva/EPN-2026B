":2.278259446251342e-15,\"parametros\":[1.9999999999761806,0.9999999522688926]},{\"epoca\":180,\"mse\":3.36746748734719e-17,\"parametros\":[1.9999999999990017,0.9999999941970117]},{\"epoca\":200,\"mse\":4.977412216100591e-19,\"parametros\":[1.999999999999958,0.9999999992944922]},{\"epoca\":220,\"mse\":7.357031535047788e-21,\"parametros\":[1.9999999999999982,0.9999999999142268]},{\"epoca\":240,\"mse\":1.0874312387434015e-22,\"parametros\":[1.9999999999999993,0.999999999989572]},{\"epoca\":260,\"mse\":1.6072923835598496e-24,\"parametros\":[1.9999999999999993,0.9999999999987322]},{\"epoca\":280,\"mse\":2.3773257803359827e-26,\"parametros\":[1.9999999999999993,0.9999999999998458]},{\"epoca\":300,\"mse\":3.5261612903316594e-28,\"parametros\":[1.9999999999999993,0.9999999999999812]},{\"epoca\":320,\"mse\":6.005673201057584e-30,\"parametros\":[1.9999999999999993,0.9999999999999977]},{\"epoca\":340,\"mse\":9.725762797256075e-31,\"parametros\":[1.9999999999999993,0.9999999999999994]},{\"epoca\":360,\"mse\":9.725762797256075e-31,\"parametros\":[1.9999999999999993,0.9999999999999994]},{\"epoca\":380,\"mse\":9.725762797256075e-31,\"parametros\":[1.9999999999999993,0.9999999999999994]},{\"epoca\":400,\"mse\":9.725762797256075e-31,\"parametros\":[1.9999999999999993,0.9999999999999994]}],\"resumen\":{\"salidas\":1,\"parametros_entrenables\":2,\"epocas\":400,\"tasa\":0.05,\"mse_inicial\":10.166666666666666,\"mse_final\":9.725762797256075e-31,\"parametros_finales\":[1.9999999999999993,0.9999999999999994],\"entrada_reservada\":1.5,\"prediccion_reservada\":[3.9999999999999987],\"gradiente_verificado\":true}}\u003c/script>\n\u003cscript>\n\"use strict\";\nconst datos = JSON.parse(document.getElementById(\"datos\").textContent);\nconst el = Object.fromEntries([\"titulo\",\"arquitectura\",\"relacion\",\"leyenda\",\"reproducir\",\"avanzar\",\"reiniciar\",\"epoca\",\"etiqueta-epoca\",\"numero-epoca\",\"numero-mse\",\"etiqueta-prediccion\",\"numero-prediccion\",\"referencia-probe\",\"ajuste\",\"perdida\",\"entrada\",\"entrada-numero\",\"tipo-entrada\",\"red\",\"neurona\",\"calculo-z\",\"calculo-a\",\"parametros\",\"interpretacion\",\"mensaje\"].map(id => [id,document.getElementById(id)]));\nlet indice=0, entrada=1.5, neurona=0, timer=null;\nconst f=(n,d=4)=>Number(n).toFixed(d), colores=[\"#087f6b\",\"#8052a0\"];\nfunction evaluar(x,p) { return Array.from({length:datos.salidas},(_,j)=>p[2*j]*x+p[2*j+1]); }\nfunction referencia(x) { return [2*x+1,-x+2].slice(0,datos.salidas); }\nfunction canvas(c) {\n    const r=c.getBoundingClientRect(), w=Math.max(250,r.width), h=Math.max(130,r.height), s=window.devicePixelRatio||1;\n    c.width=Math.round(w*s); c.height=Math.round(h*s); const ctx=c.getContext(\"2d\");\n    ctx.setTransform(s,0,0,s,0,0); ctx.clearRect(0,0,w,h); return {ctx,w,h};\n}\nfunction linea(ctx,xs,ys,px,py,color,guion=[]) {\n    ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.3;ctx.setLineDash(guion);\n    xs.forEach((x,i)=>i?ctx.lineTo(px(x),py(ys[i])):ctx.moveTo(px(x),py(ys[i])));ctx.stroke();ctx.setLineDash([]);\n}\nfunction punto(ctx,x,y,color,r=4) { ctx.beginPath();ctx.fillStyle=color;ctx.arc(x,y,r,0,Math.PI*2);ctx.fill(); }\nfunction dibujarAjuste(e) {\n    const {ctx,w,h}=canvas(el.ajuste), px=x=>42+(x+2.1)/4.2*(w-60), py=y=>15+(6-y)/10*(h-48);\n    ctx.font=\"12px Segoe UI,Arial\";\n    for(let x=-2;x\u003c=2;x++) {\n        ctx.strokeStyle=\"#e4e9f0\";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px(x),15);ctx.lineTo(px(x),h-33);ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"center\";ctx.fillText(x,px(x),h-12);\n    }\n    for(let y=-4;y\u003c=6;y+=2) {\n        ctx.strokeStyle=\"#e4e9f0\";ctx.beginPath();ctx.moveTo(42,py(y));ctx.lineTo(w-18,py(y));ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"right\";ctx.fillText(y,35,py(y)+4);\n    }\n    const xs=Array.from({length:100},(_,i)=>-2+4*i/99);\n    for(let j=0;j\u003cdatos.salidas;j++) {\n        linea(ctx,xs,xs.map(x=>referencia(x)[j]),px,py,\"#8b96a4\",[5,5]);\n        linea(ctx,xs,xs.map(x=>evaluar(x,e.parametros)[j]),px,py,colores[j]);\n        datos.x.forEach((x,i)=>punto(ctx,px(x),py(datos.y[i][j]),colores[j],3.3));\n        punto(ctx,px(entrada),py(evaluar(entrada,e.parametros)[j]),\"#d65324\",6);\n    }\n    ctx.fillStyle=\"#12315a\";ctx.textAlign=\"right\";ctx.fillText(\"x\",w-2,h-12);\n}\nfunction dibujarPerdida() {\n    const {ctx,w,h}=canvas(el.perdida), px=x=>48+x/400*(w-66), py=y=>12+(2-Math.log10(Math.max(y,1e-12)))/14*(h-43);\n    ctx.font=\"11px Segoe UI,Arial\";\n    for(const y of [10,1e-4,1e-8,1e-12]) {\n        ctx.beginPath();ctx.strokeStyle=\"#e4e9f0\";ctx.lineWidth=1;ctx.moveTo(48,py(y));ctx.lineTo(w-18,py(y));ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"right\";ctx.fillText(y.toExponential(0),42,py(y)+4);\n    }\n    const estados=datos.estados.slice(0,indice+1), actual=datos.estados[indice];\n    linea(ctx,estados.map(e=>e.epoca),estados.map(e=>e.mse),px,py,colores[0]);punto(ctx,px(actual.epoca),py(actual.mse),colores[0]);\n    ctx.fillStyle=\"#667588\";ctx.textAlign=\"left\";ctx.fillText(\"0\",48,h-10);ctx.textAlign=\"right\";ctx.fillText(\"400 épocas · escala logarítmica (mínimo 10⁻¹²)\",w-18,h-10);\n}\nfunction dibujarRed(pred) {\n    let s='\u003ctitle>Una entrada y '+datos.salidas+' neuronas de salida con activación identidad\u003c/title>';\n    s+='\u003ccircle cx=\"50\" cy=\"135\" r=\"22\" fill=\"#edf6f3\" stroke=\"#087f6b\"/>\u003ctext x=\"50\" y=\"141\" text-anchor=\"middle\" fill=\"#12315a\">x\u003c/text>';\n    for(let j=0;j\u003cdatos.salidas;j++) {\n        const y=datos.salidas===1?135:75+j*120, color=colores[j];\n        s+=`\u003cpath d=\"M72 135 L218 ${y} M282 ${y} L430 ${y}\" stroke=\"${color}\" stroke-width=\"${j===neurona?3:1.5}\" fill=\"none\"/>`;\n        s+=`\u003ccircle cx=\"250\" cy=\"${y}\" r=\"32\" fill=\"${j===neurona?'#edf6f3':'#ffffff'}\" stroke=\"${color}\" stroke-width=\"2\"/>\u003ctext x=\"250\" y=\"${y+6}\" text-anchor=\"middle\" fill=\"#12315a\">Σ\u003c/text>`;\n        s+=`\u003ctext x=\"250\" y=\"${y-44}\" text-anchor=\"middle\" font-size=\"14\" fill=\"#12315a\">Neurona ${j+1}\u003c/text>\u003ctext x=\"250\" y=\"${y+53}\" text-anchor=\"middle\" font-size=\"14\" fill=\"#12315a\">+ sesgo b${j+1}\u003c/text>`;\n        s+=`\u003ctext x=\"146\" y=\"${y-8}\" text-anchor=\"middle\" font-size=\"14\" fill=\"#12315a\">w${j+1}\u003c/text>\u003ctext x=\"452\" y=\"${y-10}\" text-anchor=\"middle\" fill=\"#12315a\">ŷ${j+1}\u003c/text>\u003ctext x=\"452\" y=\"${y+16}\" text-anchor=\"middle\" font-size=\"14\" fill=\"#12315a\">${f(pred[j],3)}\u003c/text>`;\n    }\n    s+='\u003ctext x=\"50\" y=\"182\" text-anchor=\"middle\" font-size=\"14\" fill=\"#12315a\">'+f(entrada,2)+'\u003c/text>';\n    el.red.innerHTML=s;\n}\nfunction actualizar() {\n    const e=datos.estados[indice], p=e.parametros, pred=evaluar(entrada,p), ref=referencia(entrada);\n    el.epoca.value=String(indice);el.epoca.setAttribute(\"aria-valuetext\",\"Época \"+e.epoca);\n    el[\"etiqueta-epoca\"].textContent=\"Época \"+e.epoca;el[\"numero-epoca\"].textContent=e.epoca;\n    el[\"numero-mse\"].textContent=e.mse\u003c0.0001?e.mse.toExponential(3):f(e.mse,5);\n    el[\"etiqueta-prediccion\"].textContent=\"Predicción para x = \"+f(entrada,2);\n    el[\"numero-prediccion\"].textContent=pred.map(n=>f(n,3)).join(\" ; \");\n    el[\"referencia-probe\"].textContent=\"Referencia: \"+ref.map(n=>f(n,3)).join(\" ; \");\n    el[\"tipo-entrada\"].textContent=datos.x.some(x=>Math.abs(x-entrada)\u003c1e-8)?\"Esta entrada se usó al entrenar.\":\"Esta entrada no se usó al entrenar.\";\n    el[\"calculo-z\"].textContent=`z${neurona+1} = (${f(p[2*neurona])}) × ${f(entrada,2)} + (${f(p[2*neurona+1])}) ≈ ${f(pred[neurona])}`;\n    el[\"calculo-a\"].textContent=`Activación identidad: ŷ${neurona+1} = z${neurona+1}.`;\n    el.parametros.innerHTML=pred.map((n,j)=>`\u003ctr class=\"${j===neurona?'activa':''}\">\u003ctd>${j+1}\u003c/td>\u003ctd>${f(p[2*j])}\u003c/td>\u003ctd>${f(p[2*j+1])}\u003c/td>\u003ctd>${f(n)}\u003c/td>\u003c/tr>`).join(\"\");\n    el.avanzar.disabled=indice===datos.estados.length-1;\n    dibujarAjuste(e);dibujarPerdida();dibujarRed(pred);\n}\nfunction pausar() { if(timer!==null)clearInterval(timer);timer=null;el.reproducir.textContent=\"Reproducir\"; }\nfunction irAlEstado(i) { pausar();indice=Math.min(datos.estados.length-1,Math.max(0,Math.round(i)));actualizar(); }\nfunction cambiarEntrada(x) {\n    if(!Number.isFinite(Number(x)))return;entrada=Math.min(2,Math.max(-2,Number(x)));\n    el.entrada.value=entrada;el[\"entrada-numero\"].value=entrada;actualizar();\n}\nel.titulo.textContent=datos.salidas===1?\"Una relación lineal: una neurona\":\"Varias relaciones lineales: dos salidas\";\nel.arquitectura.textContent=`Una entrada → ${datos.salidas} neurona${datos.salidas===1?'':'s'} con activación identidad → ${datos.salidas} salida${datos.salidas===1?'':'s'}. ${2*datos.salidas} parámetros entrenables.`;\nel.relacion.textContent=datos.salidas===1?\"Aprender y = 2x + 1\":\"Aprender y₁ = 2x + 1 e y₂ = −x + 2\";\nel.leyenda.innerHTML=datos.salidas===1?'\u003cspan class=\"clave\">Predicción\u003c/span>\u003cspan class=\"clave referencia\">Referencia\u003c/span>':'\u003cspan class=\"clave\">Salida 1\u003c/span>\u003cspan class=\"clave\" style=\"--verde:#8052a0\">Salida 2\u003c/span>\u003cspan class=\"clave referencia\">Referencias\u003c/span>';\nel.interpretacion.textContent=datos.salidas===1?\"El peso controla la pendiente; el sesgo desplaza la recta.\":\"Cada salida tiene su peso y su sesgo: dos neuronas aprenden dos relaciones en paralelo.\";\nel.mensaje.textContent=datos.salidas===1?\"Una sola neurona representa esta función afín.\":\"Aquí hay más neuronas porque pedimos más salidas. Todas las relaciones siguen siendo afines.\";\nel.neurona.innerHTML=Array.from({length:datos.salidas},(_,j)=>`\u003coption value=\"${j}\">${j+1}\u003c/option>`).join(\"\");\nel.epoca.max=datos.estados.length-1;\nel.epoca.addEventListener(\"input\",()=>irAlEstado(Number(el.epoca.value)));\nel.reproducir.addEventListener(\"click\",()=>{\n    if(timer!==null){pausar();return;}if(indice===datos.estados.length-1)indice=0;\n    el.reproducir.textContent=\"Pausar\";timer=setInterval(()=>{indice++;actualizar();if(indice===datos.estados.length-1)pausar();},150);\n});\nel.reiniciar.addEventListener(\"click\",()=>irAlEstado(0));\nel.avanzar.addEventListener(\"click\",()=>irAlEstado(indice+1));\nel.entrada.addEventListener(\"input\",()=>cambiarEntrada(el.entrada.value));\nel[\"entrada-numero\"].addEventListener(\"change\",()=>cambiarEntrada(el[\"entrada-numero\"].value));\nel.neurona.addEventListener(\"change\",()=>{neurona=Number(el.neurona.value);actualizar();});\nwindow.addEventListener(\"resize\",actualizar);\nwindow.simulacionAfin={datos,evaluar,irAlEstado,cambiarEntrada,estado:()=>({indice,entrada,neurona,reproduciendo:timer!==null})};\nactualizar();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!doctype html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Una neurona con dos variables económicas\u003c/title>\n\u003cstyle>\n\n    :root { --azul:#12315a; --verde:#087f6b; --naranja:#d65324; --gris:#667588; --borde:#dce3eb; }\n    * { box-sizing:border-box; }\n    body { margin:0; background:#f4f6f9; color:var(--azul); font:16px/1.5 \"Segoe UI\",Arial,sans-serif; }\n    main { max-width:1360px; margin:auto; padding:24px; }\n    h1 { font-size:clamp(23px,3vw,34px); line-height:1.2; margin:4px 0 8px; }\n    h2 { font-size:19px; margin:0 0 10px; }\n    p { margin:5px 0; }\n    .secundario { color:var(--gris); font-size:14px; }\n    .tarjeta { background:white; padding:18px; border:1px solid var(--borde); border-radius:10px; }\n    .controles { margin:18px 0 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }\n    button,select,input[type=number] { font:inherit; border:1px solid #aab8ca; border-radius:5px; padding:8px 12px; background:white; color:var(--azul); }\n    button { cursor:pointer; }\n    button:disabled { cursor:default; opacity:.5; }\n    button.principal { background:var(--azul); color:white; border-color:var(--azul); min-width:140px; }\n    button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #e49848; outline-offset:2px; }\n    input[type=range] { accent-color:var(--verde); width:100%; cursor:pointer; }\n    input[type=checkbox] { accent-color:var(--verde); }\n    .fila { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }\n    .rango { flex:1; min-width:240px; }\n    .rango label { display:flex; justify-content:space-between; gap:16px; }\n    .metricas { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }\n    .numero { display:block; font-size:29px; font-variant-numeric:tabular-nums; font-weight:650; }\n    .paneles { display:grid; grid-template-columns:1.1fr 1fr; gap:14px; }\n    canvas { display:block; width:100%; }\n    #ajuste { height:310px; }\n    #perdida { height:155px; }\n    #red { width:100%; height:auto; display:block; }\n    .leyenda { display:flex; gap:15px; flex-wrap:wrap; font-size:13px; margin:6px 0; }\n    .clave::before { content:\"\"; display:inline-block; width:20px; height:3px; margin:0 6px 3px 0; background:var(--verde); }\n    .datos::before { width:7px; height:7px; border-radius:50%; background:var(--azul); }\n    .referencia::before { height:0; border-top:2px dashed var(--gris); background:none; }\n    .lineal::before { background:var(--naranja); }\n    .consulta { padding:12px; background:#edf6f3; border-radius:6px; margin:12px 0; }\n    .consulta input[type=number] { width:100px; }\n    .consulta input[type=range] { flex:1; min-width:130px; }\n    .formula { background:#edf6f3; padding:12px; border-radius:6px; margin:10px 0; font-size:18px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }\n    .formula p + p { margin-top:9px; }\n    table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }\n    th,td { padding:5px 7px; text-align:right; border-bottom:1px solid var(--borde); }\n    th:first-child,td:first-child { text-align:left; }\n    tr.activa { background:#edf6f3; font-weight:650; }\n    .tabla { overflow-x:auto; }\n    .pie { margin-top:16px; font-size:14px; }\n    @media (max-width:850px) { main { padding:14px; } .paneles { grid-template-columns:1fr; } .metricas { gap:7px; } .numero { font-size:23px; } .tarjeta { padding:13px; } }\n    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }\n\n    .numero { font-size:26px; overflow-wrap:anywhere; }\n    #red { max-height:265px; }\n    .controles-hogar { display:grid; grid-template-columns:1fr 1fr; gap:16px; }\n    summary { cursor:pointer; font-weight:600; margin:12px 0; }\n    @media(max-width:650px) { .metricas,.controles-hogar { grid-template-columns:1fr; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n    \u003cheader>\n        \u003ch1>Predecir el gasto de un hogar con dos entradas\u003c/h1>\n        \u003cp>Ingreso y número de integrantes → una neurona → gasto mensual en alimentación.\u003c/p>\n        \u003cp class=\"secundario\">25 observaciones sintéticas · dos pesos y un sesgo · una sola salida\u003c/p>\n    \u003c/header>\n    \u003csection class=\"tarjeta controles\" aria-label=\"Reproducción del entrenamiento\">\n        \u003cbutton id=\"reproducir\" class=\"principal\" type=\"button\">Reproducir\u003c/button>\n        \u003cbutton id=\"avanzar\" type=\"button\">Siguiente estado\u003c/button>\n        \u003cbutton id=\"reiniciar\" type=\"button\">Volver al inicio\u003c/button>\n        \u003cdiv class=\"rango\">\u003clabel for=\"epoca\">\u003cspan>Estado del entrenamiento\u003c/span>\u003cstrong id=\"etiqueta-epoca\">\u003c/strong>\u003c/label>\n            \u003cinput id=\"epoca\" type=\"range\" min=\"0\" max=\"1\" step=\"1\" value=\"0\">\u003c/div>\n    \u003c/section>\n    \u003csection class=\"metricas\" aria-label=\"Resultados del estado seleccionado\">\n        \u003cdiv class=\"tarjeta\">Época\u003coutput class=\"numero\" id=\"numero-epoca\">\u003c/output>\u003cspan class=\"secundario\">Un recorrido por los 25 hogares.\u003c/span>\u003c/div>\n        \u003cdiv class=\"tarjeta\">MSE de entrenamiento\u003coutput class=\"numero\" id=\"numero-mse\">\u003c/output>\u003cspan class=\"secundario\">Unidades monetarias al cuadrado.\u003c/span>\u003c/div>\n        \u003cdiv class=\"tarjeta\">Gasto mensual predicho\u003coutput class=\"numero\" id=\"numero-prediccion\">\u003c/output>\u003cspan class=\"secundario\" id=\"referencia-probe\">\u003c/span>\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"paneles\">\n        \u003csection class=\"tarjeta\">\n            \u003ch2 id=\"titulo-vista\">\u003c/h2>\n            \u003cdiv class=\"leyenda\">\u003cspan class=\"clave\">Modelo actual\u003c/span>\u003cspan class=\"clave datos\">Hogares observados\u003c/span>\u003cspan class=\"clave referencia\">Referencia\u003c/span>\u003c/div>\n            \u003ccanvas id=\"ajuste\" role=\"img\" aria-label=\"Predicción de gasto según el ingreso, manteniendo fijo el número de integrantes\">\u003c/canvas>\n            \u003cp class=\"secundario\">Eje horizontal: ingreso en miles de u.m. Eje vertical: gasto en u.m. La gráfica fija x₂; el MSE usa las 25 observaciones.\u003c/p>\n            \u003cdiv class=\"consulta\">\n                \u003cstrong>Consultar un hogar\u003c/strong>\n                \u003cdiv class=\"controles-hogar\">\n                    \u003cdiv>\u003clabel for=\"ingreso\">Ingreso mensual (u.m.)\u003c/label>\n                        \u003cinput id=\"ingreso\" type=\"range\" min=\"1000\" max=\"4000\" step=\"50\" value=\"2500\">\n                        \u003coutput id=\"ingreso-valor\">\u003c/output>\u003c/div>\n                    \u003cdiv>\u003clabel for=\"integrantes\">Integrantes del hogar\u003c/label>\n                        \u003cinput id=\"integrantes\" type=\"range\" min=\"1\" max=\"5\" step=\"1\" value=\"3\">\n                        \u003coutput id=\"integrantes-valor\">\u003c/output>\u003c/div>\n                \u003c/div>\n                \u003cp class=\"secundario\" id=\"tipo-entrada\">\u003c/p>\n            \u003c/div>\n            \u003cdetails>\u003csummary>Ver las 25 observaciones sintéticas\u003c/summary>\n                \u003cdiv class=\"tabla\">\u003ctable>\u003ccaption>x₁: ingreso en miles de u.m.; x₂: integrantes; y: gasto mensual en u.m.\u003c/caption>\n                    \u003cthead>\u003ctr>\u003cth>Hogar\u003c/th>\u003cth>x₁\u003c/th>\u003cth>x₂\u003c/th>\u003cth>y\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"observaciones\">\u003c/tbody>\u003c/table>\u003c/div>\n            \u003c/details>\n            \u003ch2>La pérdida durante el entrenamiento\u003c/h2>\n            \u003ccanvas id=\"perdida\" role=\"img\" aria-label=\"MSE por época, en escala logarítmica\">\u003c/canvas>\n        \u003c/section>\n        \u003csection class=\"tarjeta\">\n            \u003ch2>Dos entradas, una neurona\u003c/h2>\n            \u003csvg id=\"red\" viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Ingreso e integrantes conectados a una sola neurona con dos pesos y un sesgo\">\u003c/svg>\n            \u003cdiv class=\"formula\">\n                \u003cp>\u003cstrong>Modelo:\u003c/strong> ŷ = w₁x₁ + w₂x₂ + b\u003c/p>\n                \u003cp id=\"calculo\">\u003c/p>\n                \u003cp>Activación identidad: la salida es la combinación.\u003c/p>\n            \u003c/div>\n            \u003cdiv class=\"tabla\">\u003ctable aria-label=\"Los tres parámetros estimados\">\u003cthead>\u003ctr>\u003cth>Parámetro\u003c/th>\u003cth>Valor actual\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"parametros\">\u003c/tbody>\u003c/table>\u003c/div>\n            \u003cdiv class=\"formula\">Se \u003cstrong>estiman w₁, w₂ y b\u003c/strong> con las observaciones. Después se predice el gasto ŷ de un hogar nuevo.\u003c/div>\n            \u003cp class=\"secundario\">Con más entradas, esta neurona usa más pesos. Mantiene una sola salida.\u003c/p>\n        \u003c/section>\n    \u003c/div>\n    \u003cfooter class=\"pie\">\n        \u003cp>\u003cstrong>Un peso para cada variable explicativa y un sesgo común.\u003c/strong> La familia del modelo sigue siendo afín; en dos entradas, su gráfica es un plano.\u003c/p>\n        \u003cp class=\"secundario\">Datos creados con y = 60x₁ + 40x₂ + 50, sin ruido, para comprender el entrenamiento. Son ejemplos didácticos, no observaciones de una economía real. Las asociaciones del ejemplo no demuestran causalidad.\u003c/p>\n        \u003cp class=\"secundario\">Descenso por gradiente de lote completo · tasa 0.02 · 6000 épocas. El hogar (2.5, 3) no se utilizó para estimar los parámetros.\u003c/p>\n    \u003c/footer>\n\u003c/main>\n\u003cscript id=\"datos\" type=\"application/json\">{\"x\":[[1.0,1.0],[1.0,2.0],[1.0,3.0],[1.0,4.0],[1.0,5.0],[1.5,1.0],[1.5,2.0],[1.5,3.0],[1.5,4.0],[1.5,5.0],[2.0,1.0],[2.0,2.0],[2.0,3.0],[2.0,4.0],[2.0,5.0],[3.0,1.0],[3.0,2.0],[3.0,3.0],[3.0,4.0],[3.0,5.0],[4.0,1.0],[4.0,2.0],[4.0,3.0],[4.0,4.0],[4.0,5.0]],\"y\":[150.0,190.0,230.0,270.0,310.0,180.0,220.0,260.0,300.0,340.0,210.0,250.0,290.0,330.0,370.0,270.0,310.0,350.0,390.0,430.0,330.0,370.0,410.0,450.0,490.0],\"estados\":[{\"epoca\":0,\"mse\":69725.0,\"parametros\":[10.0,10.0,0.0]},{\"epoca\":1,\"mse\":8181.75378,\"parametros\":[35.78,43.0,10.2]},{\"epoca\":2,\"mse\":1618.2265646951198,\"parametros\":[44.86236,53.14072,13.66024]},{\"epoca\":3,\"mse\":851.5003977200428,\"parametros\":[48.48429032,55.89756304,14.92960688]},{\"epoca\":4,\"mse\":703.5072827880322,\"parametros\":[50.29409218544,56.28941834848,15.48416033056]},{\"epoca\":5,\"mse\":628.2312843976513,\"parametros\":[51.477794187004484,55.94280559230016,15.803007234459521]},{\"epoca\":6,\"mse\":567.3348776770877,\"parametros\":[52.422432277712204,55.3837390 eDash(guion);\n    xs.forEach((x,i)=>i?ctx.lineTo(px(x),py(ys[i])):ctx.moveTo(px(x),py(ys[i])));ctx.stroke();ctx.setLineDash([]);\n}\nfunction punto(ctx,x,y,color,r=4) { ctx.beginPath();ctx.fillStyle=color;ctx.arc(x,y,r,0,2*Math.PI);ctx.fill(); }\nfunction dibujarAjuste(e) {\n    const {ctx,w,h}=canvas(el.ajuste),px=x=>47+(x-0.9)/3.2*(w-65),py=y=>15+(550-y)/600*(h-48);\n    ctx.font=\"12px Segoe UI,Arial\";\n    for(let x=1;x\u003c=4;x++) {\n        ctx.strokeStyle=\"#e4e9f0\";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px(x),15);ctx.lineTo(px(x),h-33);ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"center\";ctx.fillText(x,px(x),h-12);\n    }\n    for(let y=0;y\u003c=500;y+=100) {\n        ctx.strokeStyle=\"#e4e9f0\";ctx.beginPath();ctx.moveTo(47,py(y));ctx.lineTo(w-18,py(y));ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"right\";ctx.fillText(y,40,py(y)+4);\n    }\n    const xs=Array.from({length:100},(_,i)=>1+3*i/99);\n    linea(ctx,xs,xs.map(x=>referencia(x,integrantes)),px,py,\"#8b96a4\",[5,5]);\n    linea(ctx,xs,xs.map(x=>evaluar(x,integrantes,e.parametros)),px,py,\"#087f6b\");\n    datos.x.forEach((x,i)=>{if(x[1]===integrantes)punto(ctx,px(x[0]),py(datos.y[i]),\"#12315a\");});\n    punto(ctx,px(ingreso/1000),py(evaluar(ingreso/1000,integrantes,e.parametros)),\"#d65324\",6);\n}\nfunction dibujarPerdida() {\n    const {ctx,w,h}=canvas(el.perdida),px=x=>50+x/6000*(w-68),py=y=>12+(5-Math.log10(Math.max(y,1e-12)))/17*(h-43);\n    ctx.font=\"11px Segoe UI,Arial\";\n    for(const y of [1e4,1,1e-6,1e-12]) {\n        ctx.beginPath();ctx.strokeStyle=\"#e4e9f0\";ctx.lineWidth=1;ctx.moveTo(50,py(y));ctx.lineTo(w-18,py(y));ctx.stroke();\n        ctx.fillStyle=\"#667588\";ctx.textAlign=\"right\";ctx.fillText(y.toExponential(0),44,py(y)+4);\n    }\n    const estados=datos.estados.slice(0,indice+1),e=datos.estados[indice];\n    linea(ctx,estados.map(t=>t.epoca),estados.map(t=>t.mse),px,py,\"#087f6b\");punto(ctx,px(e.epoca),py(e.mse),\"#087f6b\");\n    ctx.fillStyle=\"#667588\";ctx.textAlign=\"left\";ctx.fillText(\"0\",50,h-10);ctx.textAlign=\"right\";ctx.fillText(\"6000 épocas · mínimo representado: 10⁻¹²\",w-18,h-10);\n}\nfunction dibujarRed(pred) {\n    el.red.innerHTML=`\u003ctitle>Dos entradas y una neurona de salida\u003c/title>\n        \u003cpath d=\"M90 75 L230 135 M90 205 L230 135 M290 135 L420 135\" stroke=\"#087f6b\" stroke-width=\"2.5\" fill=\"none\"/>\n        \u003ccircle cx=\"65\" cy=\"75\" r=\"25\" fill=\"#edf6f3\" stroke=\"#087f6b\"/>\u003ccircle cx=\"65\" cy=\"205\" r=\"25\" fill=\"#edf6f3\" stroke=\"#087f6b\"/>\n        \u003ccircle cx=\"260\" cy=\"135\" r=\"30\" fill=\"#edf6f3\" stroke=\"#12315a\" stroke-width=\"2\"/>\n        \u003cg fill=\"#12315a\" text-anchor=\"middle\">\u003ctext x=\"65\" y=\"81\">x₁\u003c/text>\u003ctext x=\"65\" y=\"211\">x₂\u003c/text>\u003ctext x=\"260\" y=\"142\">Σ\u003c/text>\n        \u003ctext x=\"65\" y=\"35\" font-size=\"14\">Ingreso / 1000\u003c/text>\u003ctext x=\"65\" y=\"255\" font-size=\"14\">Integrantes\u003c/text>\n        \u003ctext x=\"160\" y=\"77\">w₁\u003c/text>\u003ctext x=\"160\" y=\"211\">w₂\u003c/text>\u003ctext x=\"260\" y=\"196\">+ sesgo b\u003c/text>\n        \u003ctext x=\"455\" y=\"126\">ŷ\u003c/text>\u003ctext x=\"455\" y=\"153\" font-size=\"14\">${f(pred,2)} u.m.\u003c/text>\u003c/g>`;\n}\nfunction actualizar() {\n    const e=datos.estados[indice],p=e.parametros,x1=ingreso/1000,pred=evaluar(x1,integrantes,p);\n    el.epoca.value=indice;el.epoca.setAttribute(\"aria-valuetext\",\"Época \"+e.epoca);\n    el[\"etiqueta-epoca\"].textContent=\"Época \"+e.epoca;el[\"numero-epoca\"].textContent=e.epoca;\n    el[\"numero-mse\"].textContent=e.mse\u003c1e-4?e.mse.toExponential(3):f(e.mse,4);\n    el[\"numero-prediccion\"].textContent=f(pred,2)+\" u.m.\";\n    el[\"referencia-probe\"].textContent=\"Referencia sintética: \"+f(referencia(x1,integrantes),2)+\" u.m.\";\n    el[\"titulo-vista\"].textContent=`Vista con x₂ fijo: ${integrantes} integrante${integrantes===1?'':'s'}`;\n    el[\"ingreso-valor\"].textContent=ingreso+\" u.m. → x₁ = \"+f(x1,2);\n    el[\"integrantes-valor\"].textContent=\"x₂ = \"+integrantes;\n    el[\"tipo-entrada\"].textContent=datos.x.some(x=>Math.abs(x[0]-x1)\u003c1e-8&&x[1]===integrantes)?\"Esta combinación se usó al entrenar.\":\"Esta combinación no se usó al entrenar.\";\n    el.calculo.textContent=`ŷ = (${f(p[0])}) × ${f(x1,2)} + (${f(p[1])}) × ${integrantes} + (${f(p[2])}) ≈ ${f(pred,2)} u.m.`;\n    el.parametros.innerHTML=[\"w₁: ingreso\",\"w₂: integrantes\",\"b: sesgo\"].map((s,j)=>`\u003ctr>\u003ctd>${s}\u003c/td>\u003ctd>${f(p[j],4)}\u003c/td>\u003c/tr>`).join(\"\");\n    el.avanzar.disabled=indice===datos.estados.length-1;dibujarAjuste(e);dibujarPerdida();dibujarRed(pred);\n}\nfunction pausar() { if(timer!==null)clearInterval(timer);timer=null;el.reproducir.textContent=\"Reproducir\"; }\nfunction irAlEstado(i) { pausar();indice=Math.min(datos.estados.length-1,Math.max(0,Math.round(i)));actualizar(); }\nfunction cambiarEntradas(x1,x2) {\n    if(!Number.isFinite(Number(x1))||!Number.isFinite(Number(x2)))return;\n    ingreso=Math.min(4000,Math.max(1000,Number(x1)*1000));integrantes=Math.min(5,Math.max(1,Math.round(Number(x2))));\n    el.ingreso.value=ingreso;el.integrantes.value=integrantes;actualizar();\n}\nel.epoca.max=datos.estados.length-1;\nel.observaciones.innerHTML=datos.x.map((x,i)=>`\u003ctr>\u003ctd>${i+1}\u003c/td>\u003ctd>${f(x[0],1)}\u003c/td>\u003ctd>${x[1]}\u003c/td>\u003ctd>${f(datos.y[i],0)}\u003c/td>\u003c/tr>`).join(\"\");\nel.epoca.addEventListener(\"input\",()=>irAlEstado(Number(el.epoca.value)));\nel.reproducir.addEventListener(\"click\",()=>{\n    if(timer!==null){pausar();return;}if(indice===datos.estados.length-1)indice=0;\n    el.reproducir.textContent=\"Pausar\";timer=setInterval(()=>{indice++;actualizar();if(indice===datos.estados.length-1)pausar();},120);\n});\nel.reiniciar.addEventListener(\"click\",()=>irAlEstado(0));el.avanzar.addEventListener(\"click\",()=>irAlEstado(indice+1));\nel.ingreso.addEventListener(\"input\",()=>cambiarEntradas(Number(el.ingreso.value)/1000,integrantes));\nel.integrantes.addEventListener(\"input\",()=>cambiarEntradas(ingreso/1000,Number(el.integrantes.value)));\nwindow.addEventListener(\"resize\",actualizar);\nwindow.simulacionMultivariable={datos,evaluar,irAlEstado,cambiarEntradas,estado:()=>({indice,ingreso,integrantes,reproduciendo:timer!==null})};\nactualizar();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!doctype html>\n\u003chtml lang=\"es\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>Cómo aprende una red a aproximar el cuadrado\u003c/title>\n\u003cstyle>\n    :root { --azul:#12315a; --verde:#087f6b; --naranja:#d65324; --gris:#667588; --borde:#dce3eb; }\n    * { box-sizing:border-box; }\n    body { margin:0; background:#f4f6f9; color:var(--azul); font:16px/1.5 \"Segoe UI\",Arial,sans-serif; }\n    main { max-width:1360px; margin:auto; padding:24px; }\n    h1 { font-size:clamp(23px,3vw,34px); line-height:1.2; margin:4px 0 8px; }\n    h2 { font-size:19px; margin:0 0 10px; }\n    p { margin:5px 0; }\n    .secundario { color:var(--gris); font-size:14px; }\n    .tarjeta { background:white; padding:18px; border:1px solid var(--borde); border-radius:10px; }\n    .controles { margin:18px 0 12px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }\n    button,select,input[type=number] { font:inherit; border:1px solid #aab8ca; border-radius:5px; padding:8px 12px; background:white; color:var(--azul); }\n    button { cursor:pointer; }\n    button:disabled { cursor:default; opacity:.5; }\n    button.principal { background:var(--azul); color:white; border-color:var(--azul); min-width:140px; }\n    button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #e49848; outline-offset:2px; }\n    input[type=range] { accent-color:var(--verde); width:100%; cursor:pointer; }\n    input[type=checkbox] { accent-color:var(--verde); }\n    .fila { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }\n    .rango { flex:1; min-width:240px; }\n    .rango label { display:flex; justify-content:space-between; gap:16px; }\n    .metricas { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }\n    .numero { display:block; font-size:29px; font-variant-numeric:tabular-nums; font-weight:650; }\n    .paneles { display:grid; grid-template-columns:1.1fr 1fr; gap:14px; }\n    canvas { display:block; width:100%; }\n    #ajuste { height:310px; }\n    #perdida { height:155px; }\n    #red { width:100%; height:auto; display:block; }\n    .leyenda { display:flex; gap:15px; flex-wrap:wrap; font-size:13px; margin:6px 0; }\n    .clave::before { content:\"\"; display:inline-block; width:20px; height:3px; margin:0 6px 3px 0; background:var(--verde); }\n    .datos::before { width:7px; height:7px; border-radius:50%; background:var(--azul); }\n    .referencia::before { height:0; border-top:2px dashed var(--gris); background:none; }\n    .lineal::before { background:var(--naranja); }\n    .consulta { padding:12px; background:#edf6f3; border-radius:6px; margin:12px 0; }\n    .consulta input[type=number] { width:100px; }\n    .consulta input[type=range] { flex:1; min-width:130px; }\n    .formula { background:#edf6f3; padding:12px; border-radius:6px; margin:10px 0; font-size:18px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }\n    .formula p + p { margin-top:9px; }\n    table { width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums; }\n    th,td { padding:5px 7px; text-align:right; border-bottom:1px solid var(--borde); }\n    th:first-child,td:first-child { text-align:left; }\n    tr.activa { background:#edf6f3; font-weight:650; }\n    .tabla { overflow-x:auto; }\n    .pie { margin-top:16px; font-size:14px; }\n    @media (max-width:850px) { main { padding:14px; } .paneles { grid-template-columns:1fr; } .metricas { gap:7px; } .numero { font-size:23px; } .tarjeta { padding:13px; } }\n    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto; } }\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n    \u003cheader>\n        \u003cp class=\"secundario\">CLASE 12 · APRENDIZAJE AUTOMÁTICO INICIAL\u003c/p>\n        \u003ch1>De ejemplos a una predicción: aprender el cuadrado\u003c/h1>\n        \u003cp>Entrada → seis neuronas \u003cstrong>tanh\u003c/strong> → salida. Observa cómo cambian los pesos y los sesgos.\u003c/p>\n    \u003c/header>\n    \u003csection class=\"tarjeta controles\" aria-label=\"Reproducción del entrenamiento\">\n        \u003cbutton id=\"reproducir\" class=\"principal\" type=\"button\">Reproducir\u003c/button>\n        \u003cbutton id=\"avanzar\" type=\"button\">Siguiente estado\u003c/button>\n        \u003cbutton id=\"reiniciar\" type=\"button\">Volver al inicio\u003c/button>\n        \u003cdiv class=\"rango\">\n            \u003clabel for=\"epoca\">\u003cspan>Estado del entrenamiento\u003c/span>\u003cstrong id=\"etiqueta-epoca\">\u003c/strong>\u003c/label>\n            \u003cinput id=\"epoca\" type=\"range\" min=\"0\" max=\"1\" value=\"0\" step=\"1\">\n        \u003c/div>\n    \u003c/section>\n    \u003csection class=\"metricas\" aria-label=\"Resultados del estado seleccionado\">\n        \u003cdiv class=\"tarjeta\">\u003cspan>Época\u003c/span>\u003coutput class=\"numero\" id=\"numero-epoca\">\u003c/output>\u003cspan class=\"secundario\">Un recorrido completo de los 21 pares.\u003c/span>\u003c/div>\n        \u003cdiv class=\"tarjeta\">\u003cspan>Error cuadrático medio\u003c/span>\u003coutput class=\"numero\" id=\"numero-mse\">\u003c/output>\u003cspan class=\"secundario\">Calculado sobre los datos de entrenamiento.\u003c/span>\u003c/div>\n        \u003cdiv class=\"tarjeta\">\u003cspan id=\"etiqueta-prediccion\">Predicción para x = 1.50\u003c/span>\u003coutput class=\"numero\" id=\"numero-prediccion\">\u003c/output>\u003cspan class=\"secundario\" id=\"referencia-probe\">\u003c/span>\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"paneles\">\n        \u003csection class=\"tarjeta\" aria-label=\"Ajuste a los datos y evolución de la pérdida\">\n            \u003ch2>¿Qué función está representando la red?\u003c/h2>\n            \u003cdiv class=\"leyenda\">\u003cspan class=\"clave datos\">21 pares (x, x²)\u003c/span>\u003cspan class=\"clave\">Red\u003c/span>\u003cspan class=\"clave referencia\">Referencia x²\u003c/span>\u003cspan class=\"clave lineal\">Neurona lineal\u003c/span>\u003c/div>\n            \u003ccanvas id=\"ajuste\" role=\"img\" aria-label=\"Datos de entrenamiento y predicción de la red en el intervalo de menos dos a dos\">\u003c/canvas>\n            \u003cdiv class=\"fila secundario\">\n                \u003clabel>\u003cinput id=\"mostrar-referencia\" type=\"checkbox\" checked> Mostrar referencia x²\u003c/label>\n                \u003clabel>\u003cinput id=\"mostrar-lineal\" type=\"checkbox\"> Comparar con una neurona lineal\u003c/label>\n            \u003c/div>\n            \u003cdiv class=\"consulta\">\n                \u003clabel for=\"entrada\">\u003cstrong>Consultar la red con sus parámetros actuales\u003c/strong>\u003c/label>\n                \u003cdiv class=\"fila\">\n                    \u003cinput id=\"entrada\" type=\"range\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"1.5\">\n                    \u003cinput id=\"entrada-numero\" aria-label=\"Número de entrada\" type=\"number\" min=\"-2\" max=\"2\" step=\"0.05\" value=\"1.5\">\n                \u003c/div>\n                \u003cp id=\"tipo-entrada\" class=\"secundario\">\u003c/p>\n            \u003c/div>\n            \u003ch2>La pérdida durante el entrenamiento\u003c/h2>\n            \u003ccanvas id=\"perdida\" role=\"img\" aria-label=\"Error cuadrático medio por época, con escala logarítmica\">\u003c/canvas>\n            \u003cp class=\"secundario\" id=\"resumen-lineal\">\u003c/p>\n        \u003c/section>\n        \u003csection class=\"tarjeta\" aria-label=\"Pesos, sesgos y cálculo de una neurona\">\n            \u003ch2>Dentro de la red\u003c/h2>\n            \u003csvg id=\"red\" viewBox=\"0 0 520 270\" role=\"img\" aria-label=\"Una entrada conectada a seis neuronas tanh y una salida\">\u003c/svg>\n            \u003cdiv class=\"fila\">\n                \u003clabel for=\"neurona\">Observar la neurona\u003c/label>\n                \u003cselect id=\"neurona\" aria-label=\"Neurona de la capa intermedia\">\n                    \u003coption value=\"0\">1\u003c/option>\u003coption value=\"1\">2\u003c/option>\u003coption value=\"2\">3\u003c/option>\n                    \u003coption value=\"3\">4\u003c/option>\u003coption value=\"4\">5\u003c/option>\u003coption value=\"5\">6\u003c/option>\n                \u003c/select>\n            \u003c/div>\n            \u003cdiv class=\"formula\">\n                \u003cp>\u003cstrong>Combinar:\u003c/strong> z = peso × entrada + sesgo\u003c/p>\n                \u003cp id=\"calculo-z\">\u003c/p>\n                \u003cp id=\"calculo-a\">\u003c/p>\n            \u003c/div>\n            \u003cp class=\"secundario\">Cada neurona transforma su combinación con tanh. La salida pondera esas respuestas y suma su propio sesgo.\u003c/p>\n            \u003cdiv class=\"tabla\">\n                \u003ctable aria-label=\"Parámetros y contribuciones de las seis neuronas\">\n                    \u003cthead>\u003ctr>\u003cth>Neurona\u003c/th>\u003cth>Peso w\u003c/th>\u003cth>Sesgo b\u003c/th>\u003cth>Peso v\u003c/th>\u003cth>Respuesta a\u003c/th>\u003cth>v × a\u003c/th>\u003c/tr>\u003c/thead>\n                    \u003ctbody id=\"parametros\">\u003c/tbody>\n                \u003c/table>\n            \u003c/div>\n            \u003cdiv class=\"formula\" id=\"calculo-salida\">\u003c/div>\n            \u003cp class=\"secundario\">Mover la entrada cambia la predicción; avanzar el entrenamiento cambia los parámetros.\u003c/p>\n        \u003c/section>\n    \u003c/div>\n    \u003cfooter class=\"pie\">\n        \u003cp>\u003cstrong>Para discutir:\u003c/strong> ¿cambiar solo una recta permite aprender una parábola? ¿Qué cambia al incorporar neuronas no lineales?\u003c/p>\n        \u003cp class=\"secundario\">Reproducción de un entrenamiento real con descenso por gradiente: 12 000 épocas, tasa 0.02, semilla 7 y 19 parámetros. Los estados guardados no están separados por el mismo número de épocas.\u003c/p>\n        \u003cp class=\"secundario\">La función x² genera las etiquetas de referencia; la predicción procede de los pesos y sesgos entrenados. El valor 1.5 no está entre los 21 datos de entrenamiento. Evaluamos aquí interpolación en [−2, 2].\u003c/p>\n    \u003c/footer>\n\u003c/main>\n\u003cscript id=\"trayectoria-data\" type=\"application/json\">{\"x\":[-2.0,-1.8,-1.6,-1.4,-1.2,-1.0,-0.7999999999999998,-0.5999999999999999,-0.3999999999999999,-0.19999999999999996,0.0,0.20000000000000018,0.40000000000000036,0.6000000000000001,0.8000000000000003,1.0,1.2000000000000002,1.4000000000000004,1.6,1.8000000000000003,2.0],\"y\":[4.0,3.24,2.5600000000000005,1.9599999999999997,1.44,1.0,0.6399999999999997,0.3599999999999998,0.15999999999999992,0.03999999999999998,0.0,0.04000000000000007,0.16000000000000028,0.3600000000000001,0.6400000000000005,1.0,1.4400000000000004,1.960000000000001,2.5600000000000005,3.240000000000001,4.0],\"estados\":[{\"epoca\":0,\"parametros\":[1.352420563,-0.3727498964,0.0262561309,0.3260130264,-0.6311384229,0.0016524583,-0.0002671158,-0.5264172919,0.3052974017,0.1801495548,-0.1876286922,-0.0514644784,0.2526496871,-0.1306782076,-0.1213745393,-0.7266207062,0.2772901559,0.0619404526,0.0],\"mse\":4.246362992240509,\"lineal\":[0.5,0.0]},{\"epoca\":20,\"parametros\":[1.352967319,-0.2537269883,0.0240306231,0.2776425289,-0.6521579712,0.0053893943,-0.0142986007,-0.6512132581,0.2889190712,-0.1788293329,-0.1352147984,-0.0165666368,0.2946859009,-0.4347372531,0.0805572817,-0.6994185952,0.2090497258,0.0380697427, eturn { z, a, contribuciones, suma, prediccion:suma + p[18] };\n}\n\nfunction prepararCanvas(canvas) {\n    const rect = canvas.getBoundingClientRect();\n    const ancho = Math.max(rect.width, 250), alto = Math.max(rect.height, 130);\n    const escala = window.devicePixelRatio || 1;\n    canvas.width = Math.round(ancho * escala); canvas.height = Math.round(alto * escala);\n    const ctx = canvas.getContext(\"2d\");\n    ctx.setTransform(escala, 0, 0, escala, 0, 0); ctx.clearRect(0, 0, ancho, alto);\n    return { ctx, ancho, alto };\n}\n\nfunction curva(ctx, xs, ys, px, py, color, patron = []) {\n    ctx.beginPath(); ctx.setLineDash(patron); ctx.strokeStyle = color; ctx.lineWidth = 2.4;\n    xs.forEach((x, i) => i ? ctx.lineTo(px(x), py(ys[i])) : ctx.moveTo(px(x), py(ys[i])));\n    ctx.stroke(); ctx.setLineDash([]);\n}\n\nfunction punto(ctx, x, y, color, radio = 4) {\n    ctx.beginPath(); ctx.fillStyle = color; ctx.arc(x, y, radio, 0, 2 * Math.PI); ctx.fill();\n}\n\nfunction dibujarAjuste(estado) {\n    const { ctx, ancho, alto } = prepararCanvas(elementos.ajuste);\n    const margen = { izq:42, der:18, arriba:17, abajo:32 };\n    const px = x => margen.izq + (x + 2.12) / 4.24 * (ancho - margen.izq - margen.der);\n    const py = y => alto - margen.abajo - (y + 0.8) / 5.5 * (alto - margen.arriba - margen.abajo);\n    ctx.font = \"12px Segoe UI, Arial\";\n    for (let x = -2; x \u003c= 2; x++) {\n        ctx.beginPath(); ctx.strokeStyle = colores.grid; ctx.lineWidth = 1;\n        ctx.moveTo(px(x), margen.arriba); ctx.lineTo(px(x), alto - margen.abajo); ctx.stroke();\n        ctx.fillStyle = colores.gris; ctx.textAlign = \"center\"; ctx.fillText(String(x), px(x), alto - 10);\n    }\n    for (let y = 0; y \u003c= 4; y++) {\n        ctx.beginPath(); ctx.strokeStyle = colores.grid;\n        ctx.moveTo(margen.izq, py(y)); ctx.lineTo(ancho - margen.der, py(y)); ctx.stroke();\n        ctx.fillStyle = colores.gris; ctx.textAlign = \"right\"; ctx.fillText(String(y), margen.izq - 8, py(y) + 4);\n    }\n    const xs = Array.from({ length:181 }, (_, i) => -2 + 4 * i / 180);\n    if (elementos[\"mostrar-referencia\"].checked) curva(ctx, xs, xs.map(x => x * x), px, py, colores.gris, [5, 5]);\n    if (elementos[\"mostrar-lineal\"].checked) curva(ctx, xs, xs.map(x => estado.lineal[0] * x + estado.lineal[1]), px, py, colores.naranja, [7, 3]);\n    curva(ctx, xs, xs.map(x => evaluar(x, estado.parametros).prediccion), px, py, colores.verde);\n    datos.x.forEach((x, i) => punto(ctx, px(x), py(datos.y[i]), colores.azul, 3.6));\n    const prediccion = evaluar(entrada, estado.parametros).prediccion;\n    ctx.setLineDash([3, 3]); ctx.strokeStyle = colores.naranja; ctx.lineWidth = 1.5;\n    ctx.beginPath(); ctx.moveTo(px(entrada), py(entrada * entrada)); ctx.lineTo(px(entrada), py(prediccion)); ctx.stroke(); ctx.setLineDash([]);\n    punto(ctx, px(entrada), py(prediccion), colores.naranja, 6);\n    ctx.fillStyle = colores.azul; ctx.textAlign = \"right\"; ctx.fillText(\"x\", ancho - 2, alto - 10);\n}\n\nfunction dibujarPerdida() {\n    const { ctx, ancho, alto } = prepararCanvas(elementos.perdida);\n    const px = epoca => 42 + epoca / datos.resumen.epocas * (ancho - 60);\n    const py = mse => 12 + (1 - Math.log10(mse)) / 4 * (alto - 42);\n    ctx.font = \"11px Segoe UI, Arial\";\n    for (const valor of [1, 0.1, 0.01, 0.001]) {\n        ctx.beginPath(); ctx.strokeStyle = colores.grid; ctx.lineWidth = 1;\n        ctx.moveTo(42, py(valor)); ctx.lineTo(ancho - 18, py(valor)); ctx.stroke();\n        ctx.fillStyle = colores.gris; ctx.textAlign = \"right\"; ctx.fillText(String(valor), 36, py(valor) + 4);\n    }\n    const estados = datos.estados.slice(0, indice + 1);\n    curva(ctx, estados.map(e => e.epoca), estados.map(e => e.mse), px, py, colores.verde);\n    const actual = datos.estados[indice]; punto(ctx, px(actual.epoca), py(actual.mse), colores.verde);\n    ctx.fillStyle = colores.gris; ctx.textAlign = \"left\"; ctx.fillText(\"0\", 42, alto - 8);\n    ctx.textAlign = \"right\"; ctx.fillText(\"12 000 épocas · MSE en escala logarítmica\", ancho - 15, alto - 8);\n}\n\nfunction dibujarRed() {\n    const entradaX = 55, salidaX = 465, centralX = 260;\n    const partes = ['\u003ctitle>Red con una entrada, seis neuronas tanh y una salida\u003c/title>'];\n    for (let j = 0; j \u003c 6; j++) {\n        const y = 40 + 38 * j, activa = j === neurona;\n        partes.push(`\u003cpath d=\"M ${entradaX + 16} 134 L ${centralX - 17} ${y} M ${centralX + 17} ${y} L ${salidaX - 17} 134\" stroke=\"${activa ? colores.verde : '#bac5d2'}\" stroke-width=\"${activa ? 3 : 1}\" fill=\"none\"/>`);\n        partes.push(`\u003ccircle cx=\"${centralX}\" cy=\"${y}\" r=\"16\" fill=\"${activa ? '#dceee8' : '#ffffff'}\" stroke=\"${activa ? colores.verde : colores.azul}\" stroke-width=\"${activa ? 2.5 : 1}\"/>\u003ctext x=\"${centralX}\" y=\"${y + 5}\" text-anchor=\"middle\" font-size=\"13\" fill=\"${colores.azul}\">${j + 1}\u003c/text>`);\n    }\n    partes.push(`\u003ccircle cx=\"${entradaX}\" cy=\"134\" r=\"20\" fill=\"#edf6f3\" stroke=\"${colores.verde}\"/>\u003ctext x=\"${entradaX}\" y=\"139\" text-anchor=\"middle\" fill=\"${colores.azul}\">x\u003c/text>`);\n    partes.push(`\u003ccircle cx=\"${salidaX}\" cy=\"134\" r=\"20\" fill=\"#fff0e8\" stroke=\"${colores.naranja}\"/>\u003ctext x=\"${salidaX}\" y=\"139\" text-anchor=\"middle\" fill=\"${colores.azul}\">ŷ\u003c/text>`);\n    partes.push(`\u003ctext x=\"55\" y=\"178\" text-anchor=\"middle\" font-size=\"14\" fill=\"${colores.azul}\">${f(entrada, 2)}\u003c/text>\u003ctext x=\"260\" y=\"18\" text-anchor=\"middle\" font-size=\"14\" fill=\"${colores.azul}\">tanh(wⱼx + bⱼ)\u003c/text>`);\n    partes.push(`\u003ctext x=\"155\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"${colores.azul}\">pesos w\u003c/text>\u003ctext x=\"374\" y=\"24\" text-anchor=\"middle\" font-size=\"13\" fill=\"${colores.azul}\">pesos v\u003c/text>\u003ctext x=\"465\" y=\"178\" text-anchor=\"middle\" font-size=\"13\" fill=\"${colores.azul}\">+ sesgo c\u003c/text>`);\n    elementos.red.innerHTML = partes.join(\"\");\n}\n\nfunction actualizar() {\n    const estado = datos.estados[indice], p = estado.parametros, evaluacion = evaluar(entrada, p);\n    elementos.epoca.value = String(indice);\n    elementos.epoca.setAttribute(\"aria-valuetext\", `Época ${estado.epoca}`);\n    elementos[\"etiqueta-epoca\"].textContent = `Época ${estado.epoca.toLocaleString(\"es\")}`;\n    elementos[\"numero-epoca\"].textContent = estado.epoca.toLocaleString(\"es\");\n    elementos[\"numero-mse\"].textContent = f(estado.mse, 5);\n    elementos[\"etiqueta-prediccion\"].textContent = `Predicción para x = ${f(entrada, 2)}`;\n    elementos[\"numero-prediccion\"].textContent = f(evaluacion.prediccion);\n    elementos[\"referencia-probe\"].textContent = `Referencia: ${f(entrada * entrada)} · error absoluto: ${f(Math.abs(evaluacion.prediccion - entrada * entrada))}`;\n    elementos[\"tipo-entrada\"].textContent = datos.x.some(x => Math.abs(x - entrada) \u003c 1e-8)\n        ? \"Esta entrada forma parte del conjunto de entrenamiento.\"\n        : \"Esta entrada no se usó para ajustar los parámetros.\";\n    elementos[\"calculo-z\"].textContent = `z${neurona + 1} = (${f(p[neurona])}) × ${f(entrada, 2)} + (${f(p[6 + neurona])}) ≈ ${f(evaluacion.z[neurona])}`;\n    elementos[\"calculo-a\"].textContent = `a${neurona + 1} = tanh(z${neurona + 1}) ≈ ${f(evaluacion.a[neurona])}`;\n    elementos.parametros.innerHTML = Array.from({ length:6 }, (_, j) => `\u003ctr class=\"${j === neurona ? 'activa' : ''}\">\u003ctd>${j + 1}\u003c/td>\u003ctd>${f(p[j], 3)}\u003c/td>\u003ctd>${f(p[6 + j], 3)}\u003c/td>\u003ctd>${f(p[12 + j], 3)}\u003c/td>\u003ctd>${f(evaluacion.a[j], 3)}\u003c/td>\u003ctd>${f(evaluacion.contribuciones[j], 3)}\u003c/td>\u003c/tr>`).join(\"\");\n    elementos[\"calculo-salida\"].textContent = `Salida: ŷ = Σ(vⱼ × aⱼ) + c ≈ ${f(evaluacion.suma)} + (${f(p[18])}) ≈ ${f(evaluacion.prediccion)}`;\n    const mseLineal = datos.x.reduce((total, x, i) => total + (estado.lineal[0] * x + estado.lineal[1] - datos.y[i]) ** 2, 0) / datos.x.length;\n    elementos[\"resumen-lineal\"].textContent = elementos[\"mostrar-lineal\"].checked\n        ? `Neurona lineal: ŷ = ${f(estado.lineal[0], 3)}x + ${f(estado.lineal[1], 3)} · MSE = ${f(mseLineal, 4)}. También está entrenada con estos datos.` : \"\";\n    elementos.avanzar.disabled = indice === datos.estados.length - 1;\n    dibujarAjuste(estado); dibujarPerdida(); dibujarRed();\n}\n\nfunction pausar() {\n    if (temporizador !== null) clearInterval(temporizador);\n    temporizador = null; elementos.reproducir.textContent = \"Reproducir\";\n}\n\nelementos.epoca.max = String(datos.estados.length - 1);\nelementos.epoca.addEventListener(\"input\", () => { pausar(); indice = Number(elementos.epoca.value); actualizar(); });\nelementos.reproducir.addEventListener(\"click\", () => {\n    if (temporizador !== null) { pausar(); return; }\n    if (indice === datos.estados.length - 1) indice = 0;\n    elementos.reproducir.textContent = \"Pausar\";\n    temporizador = setInterval(() => {\n        indice = Math.min(indice + 1, datos.estados.length - 1); actualizar();\n        if (indice === datos.estados.length - 1) pausar();\n    }, 120);\n});\nelementos.avanzar.addEventListener(\"click\", () => { pausar(); indice = Math.min(indice + 1, datos.estados.length - 1); actualizar(); });\nelementos.reiniciar.addEventListener(\"click\", () => { pausar(); indice = 0; actualizar(); });\nfunction cambiarEntrada(valor) {\n    const numero = Number(valor);\n    if (!Number.isFinite(numero)) return;\n    entrada = Math.min(2, Math.max(-2, numero));\n    elementos.entrada.value = String(entrada); elementos[\"entrada-numero\"].value = String(entrada); actualizar();\n}\nelementos.entrada.addEventListener(\"input\", () => cambiarEntrada(elementos.entrada.value));\nelementos[\"entrada-numero\"].addEventListener(\"change\", () => cambiarEntrada(elementos[\"entrada-numero\"].value));\nelementos.neurona.addEventListener(\"change\", () => { neurona = Number(elementos.neurona.value); actualizar(); });\nelementos[\"mostrar-referencia\"].addEventListener(\"change\", actualizar);\nelementos[\"mostrar-lineal\"].addEventListener(\"change\", actualizar);\nwindow.addEventListener(\"resize\", actualizar);\n// Funciones expuestas para verificar las predicciones y las interacciones sin red.\nwindow.simulacionCuadrado = { datos, evaluar, cambiarEntrada,\n    irAlEstado(i) { pausar(); indice = Math.min(datos.estados.length - 1, Math.max(0, Math.round(i))); actualizar(); },\n    estado() { return { indice, entrada, neurona, reproduciendo:temporizador !== null }; }\n};\nactualizar();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"]</script>
<script>
